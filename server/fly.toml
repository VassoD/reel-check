app = "reel-check-vd"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # Analyses run in the background after the request returns, so the machine must not be stopped mid-run.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[mounts]]
  source = "reel_check_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  # ffmpeg and yt-dlp spike briefly while merging video; swap keeps that from killing the server.
  swap_size_mb = 512
